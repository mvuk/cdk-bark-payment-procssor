[package]
name = "cdk-payment-processor-template"
version = "0.0.1"
edition = "2021"
authors = ["thesimplekid <tsk@thesimplekid.com>"]
description = "Generic CDK Payment Processor Template"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
cdk-common = { git = "https://github.com/thesimplekid/cdk", branch = "onchain_bdk", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { git = "https://github.com/thesimplekid/cdk", branch = "onchain_bdk", default-features = false }
# Bark M1: point at the shepherd workspace path deps so we get `cosign_and_store_board`.
ark-lib = { git = "https://gitlab.com/matthewvuk/shepherd.git" }
bark-bitcoin-ext = { git = "https://gitlab.com/matthewvuk/shepherd.git" }
bark-wallet = { git = "https://gitlab.com/matthewvuk/shepherd.git", features = ["onchain-bdk"] }
# rust-payjoin v2 receiver (local clone). v2 + io give us the typestate flow and reqwest helpers.
payjoin = { git = "https://github.com/payjoin/rust-payjoin", rev = "fb884d11996acea9d9bd5573b32b549b1bfdc334", features = ["v2", "io"] }
# Proof-of-Reserves bundle schema (shared, byte-for-byte canonical() with the verifier).
ark-audit-shared = { git = "https://gitlab.com/matthewvuk/ark-audit-shared.git" }
# Nostr publisher for PoR (kind-30078 latest + kind-78 history). Pinned to 0.44.x to match
# cdk's vendored nostr-sdk (NORDIC-POR-CONFIRMED-FACTS §6). default-features off; nip44 + nip59
# not needed for plain signed-event publish.
nostr-sdk = { version = "0.44", default-features = false }
bip39 = "2.0"
bitcoin = "0.32"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
lightning-invoice = "0.34"
futures-core = "0.3.31"
redb = "4.1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "test-util"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-build = "0.14"

[features]
default = []
